services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/scanner.db
      - DEMO_API_URL=http://demo_api:8000
      - OPENAI_API_KEY=your_openai_api_key_here
    volumes:
      - .:/app
      - scanner_data:/app/data
      - ./sample_reports:/app/sample_reports
    depends_on:
      - demo_api
      - vampi
    networks:
      - scanner-net
      - dvws-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:9000
    depends_on:
      - scanner
    networks:
      - scanner-net

  vampi:
    image: erev0s/vampi:latest
    container_name: vampi
    ports:
      - "9001:5000"
    environment:
      - ENV_file=False
    networks:
      - scanner-net

  demo_api:
    build:
      context: ./demo_api
      dockerfile: Dockerfile
    ports:
      - "9002:8000"
    environment:
      - DEMO_API_SECRET_KEY=demosecret # Default research key; CHANGE FOR PRODUCTION
    networks:
      - scanner-net

  # ========== DVWS: Damn Vulnerable Web Services ==========
  dvws-mongo:
    image: mongo:4.0.4
    networks:
      - dvws-net

  dvws-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: dvws_sqldb
    networks:
      - dvws-net

  dvws:
    build:
      context: ./dvws-node
    ports:
      - "9003:80"
      - "9090:9090"
    command: sh -c "/wait && node startup_script.js && npm start"
    environment:
      WAIT_HOSTS: dvws-mysql:3306, dvws-mongo:27017
      WAIT_HOSTS_TIMEOUT: 160
      SQL_LOCAL_CONN_URL: dvws-mysql
      MONGO_LOCAL_CONN_URL: mongodb://dvws-mongo:27017/node-dvws
    depends_on:
      - dvws-mongo
      - dvws-mysql
    networks:
      - scanner-net
      - dvws-net

networks:
  scanner-net:
  dvws-net:


volumes:
  scanner_data:
